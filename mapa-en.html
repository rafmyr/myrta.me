  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
     --ink: #1d1d1f;
     --gray: #86868b;
     --gray-light: #d2d2d7;
     --white: #ffffff;
     --sans: -apple-system, "system-ui", "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
     --mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    body {
      background: var(--ink);
      color: #e8e8ed;
      font-family: var(--sans);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    canvas { display: block; }

    /* ── Nav ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      height: 49px;
      background: rgba(29,29,31,0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .topbar-logo {
      font-size: 17px;
      font-weight: 600;
      color: #e8e8ed;
      letter-spacing: -0.3px;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .topbar-logo:hover { opacity: 0.7; }

    .topbar-back {
      font-size: 12px;
      font-weight: 400;
      color: var(--gray);
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .topbar-back:hover { opacity: 0.7; }

    .topbar-filters {
      display: flex;
      gap: 4px;
    }
    .topbar-lang {
      font-size: 11px;
      font-weight: 400;
      color: var(--gray);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 5px 12px;
      border-radius: 980px;
      transition: all 0.3s;
      font-family: var(--sans);
      margin-left: 8px;
    }
    .topbar-lang:hover {
      color: #ccc;
      border-color: rgba(255,255,255,0.2);
    }

    .topbar-filters button {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--gray);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 980px;
      letter-spacing: 0.01em;
    }
    .topbar-filters button:hover {
      color: #ccc;
      border-color: rgba(255,255,255,0.2);
    }
    .topbar-filters button.active {
      background: rgba(255,255,255,0.1);
      color: #e8e8ed;
      border-color: rgba(255,255,255,0.2);
    }

    /* ── Panel (node detail) ── */
    .panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 380px;
      z-index: 150;
      background: rgba(29,29,31,0.96);
      backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255,255,255,0.06);
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      padding: 72px 28px 28px;
    }
    .panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--gray);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      transition: color 0.2s;
    }
    .panel-close:hover { color: #fff; }

    .panel-cat {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .panel-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 20px;
      color: #e8e8ed;
    }
    .panel-section { margin-bottom: 24px; }
    .panel-section-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-desc {
      font-size: 15px;
      line-height: 1.5;
      color: #b0b0b5;
      font-style: italic;
    }
    .panel-case {
      font-size: 13px;
      line-height: 1.6;
      color: #999;
      margin-bottom: 4px;
    }
    .panel-case strong { color: #ccc; font-weight: 600; }
    .panel-connections {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .panel-conn-tag {
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 980px;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
    }
    .panel-conn-tag:hover {
      color: #e8e8ed;
      border-color: rgba(255,255,255,0.3);
    }

    .panel-article-link {
      display: block;
      font-size: 13px;
      color: #999;
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: color 0.2s;
    }
    .panel-article-link:hover { color: #e8e8ed; }
    .panel-article-link::before { content: '→ '; opacity: 0.5; }

    /* ── Legend ── */
    .legend {
      position: fixed;
      bottom: 20px;
      left: 24px;
      z-index: 100;
      display: flex;
      gap: 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--gray);
      letter-spacing: 0.03em;
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ── Hint ── */
    .hint {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 100;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      text-align: right;
      line-height: 1.8;
    }

    /* ── Center title ── */
    .center-title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      text-align: center;
      pointer-events: none;
      transition: opacity 1.5s;
    }
    .center-title.hidden { opacity: 0; }
    .center-title h1 {
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: rgba(255,255,255,0.25);
      line-height: 1.3;
    }
    .center-title p {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.15);
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .topbar-filters { display: none; }
      .mobile-filters {
        display: flex !important;
        position: fixed;
        bottom: 56px;
        left: 12px;
        right: 12px;
        z-index: 100;
        gap: 4px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .mobile-filters button {
        background: rgba(29,29,31,0.9);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--gray);
        font-family: var(--sans);
        font-size: 10px;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 980px;
      }
      .mobile-filters button.active {
        background: rgba(255,255,255,0.1);
        color: #e8e8ed;
        border-color: rgba(255,255,255,0.2);
      }
      .panel {
        width: 100%;
        padding: 64px 20px 20px;
      }
      .legend { display: none; }
      .hint {
        bottom: 14px;
        right: 50%;
        transform: translateX(50%);
        text-align: center;
      }
    }

    .mobile-filters { display: none; }
  </style>
</head>

var nodes = [
  // DNA
  { id:'farmacja',  label:'Pharmacy',    cat:'dna', size:36, meta:'5 years of study taught me precision, protocols, and humility in the face of complexity. Same things come in handy in business.', cases:['Silesian Medical Academy 1994-99','Pod Arkadami Pharmacy since 2000','Pelion, NEUCA, Super-Pharm'] },
  { id:'slask',     label:'Silesia',       cat:'dna', size:14, meta:'Katowice, Będzin, Tychy. I don\'t say "challenge". I say "problem to solve".', cases:[] },
  { id:'ciekawosc', label:'Curiosity',   cat:'dna', size:20, meta:'Every industry looks different from the outside. From the inside? Same problems everywhere. I spot the patterns.', cases:[] },

  { id:'ineo',    label:'INEOGroup\n×Super-Pharm', cat:'biznes', size:30, meta:'PM + pharmaceutical expert. The only alternative to Kamsoft\'s monopoly in pharmacy IT market.', cases:['Pharmacy system migration to iXPOS','Specifications, dev team coordination'] },
  { id:'concept', label:'Concept\nAutomatic',      cat:'biznes', size:26, meta:'Vending. Pursuing innovation in retail through automation and robotics.', cases:['Sipply project'] },
  { id:'misiarz', label:'Misiarz',                 cat:'biznes', size:26, meta:'Bicycles for children who can\'t walk. Father-in-law\'s company from 1987. CE, ISO, export. Not a business - a commitment.', cases:['Custom rehabilitation bicycles','CE, ISO 9001 certification','Export to Sweden, NFZ/PFRON reimbursement'] },
  { id:'apteka',  label:'Pod Arkadami\nPharmacy',    cat:'biznes', size:18, meta:'Będzin, since 2000. 25 years of stability in a portfolio of chaos.', cases:['Own pharmacy since 2000'] },

  // Business - history
  { id:'neuca',    label:'NEUCA',                   cat:'biznes', size:24, meta:'3,800 pharmacies. 60 field reps. 200 telesales. How do you manage something like that? With systems.', cases:['Director of Development & Strategy 2007-13','"Świat Zdrowia" network ~1,200 pharmacies','PMO, MBO, board-level strategy'] },
  { id:'pelion',   label:'Pelion\nDOZ',             cat:'biznes', size:20, meta:'First online pharmacy in Poland. 2003. IE6. Flash. But it worked.', cases:['doz.pl - 1st online pharmacy in Poland','Rehab equipment in pharmacies → +25%'] },
  { id:'mojafarm', label:'Moja\nFarmacja',          cat:'biznes', size:17, meta:'CEO. Portuguese VC. 5 companies. +33% margin in 12 months. Then the VC changed their mind. Classic.', cases:['+12.7% sales in 12 months','+33.3% gross margin','Lean Startup, online budgeting'] },
  { id:'rmcons',   label:'RM Consulting\nDeloitte', cat:'biznes', size:17, meta:'Audits, restructuring, M&A. For Deloitte. I say this quietly.', cases:['Organizational audits','Restructuring & M&A','Business model optimization'] },

  // Skills
  { id:'analizabiz', label:'Business\nAnalysis',      cat:'skill', size:32, meta:'I translate between business and code. Both think the other is incompetent. My job is the bridge.', cases:['INEOGroup: iXPOS specifications','NEUCA: pharmacy portfolio analysis'] },

  { id:'marketing',  label:'Strategic\nMarketing',   cat:'skill', size:20, meta:'Marketing is not advertising. It\'s a promise a company makes to the market. And then has to keep.', cases:['NEUCA: budget, 200 telesales, brand positioning'] },
  { id:'siec',       label:'Network\nManagement',       cat:'skill', size:28, meta:'From 120 pharmacies to 3,800. Then back to a handful. I know both sides. Scale changes EVERYTHING.', cases:['NEUCA: 3,800 pharmacies "Świat Zdrowia"','Pelion: franchise network'] },
  { id:'ai',         label:'AI / agents',               cat:'skill', size:34, meta:'I run projects with Spec-Driven Development: specification and tests before code, code written by AI agents under my supervision. 80% of what\'s called AI is marketing. 20% changes the game.', cases:['Regulatory matrix: 361 rules, 1083 tests, built with agents (SDD)','Retail/pharmacy process matrix (in progress)','Article series: AI, processes, transformation','Concept: demand forecasting with ML'] },
  { id:'sdd',     label:'Spec-Driven\nDevelopment',      cat:'skill',  size:28, meta:'How I work with agents: a written, verifiable specification and tests first, code second. The human decides what is true, the machine executes.', cases:['Regulatory matrix for pharmacy systems','Retail/pharmacy process matrix (in progress)','Every requirement has a source and three tests'] },
  { id:'macierz', label:'Regulatory\nmatrix',            cat:'biznes', size:26, meta:'361 rules, 1083 test scenarios, 122 source cards referencing specific regulations. Built with AI agents, without a team of developers.', cases:['Specification backbone for pharmacy POS/ERP','Status: draft with one open gap, nothing guessed'] },
  { id:'transfai',  label:'AI\ntransformation',           cat:'skill',  size:30, meta:'Adopting AI is a redesign of processes, roles and incentives, not a tool purchase. From scattered pilots to a portfolio of change with owners and metrics.', cases:['Auditing sources of truth before launching agents','The manager role contract: what goes, what stays','Process metrics instead of headcount trained'] },
  { id:'macierzpr', label:'Process\nmatrix',              cat:'biznes', size:24, meta:'A second matrix, this time from the angle of daily pharmacy and retail work: goods receipt, prescription fulfilment, end-of-day close. A base for building systems and finding waste.', cases:['In progress, 2026','Processes instead of statutes: where time actually goes'] },

  { id:'it',         label:'IT',                        cat:'skill', size:24, meta:'I don\'t code. But I understand code and translate it to human. Implementations are not technology - they\'re change.', cases:['INEOGroup × Super-Pharm','Pelion: e-commerce','BIT Technologies 1998-2000'] },
  { id:'ma',         label:'M&A',                       cat:'skill', size:18, meta:'Buying companies is easy. Making them work after the purchase - not so much. Due diligence is just the beginning.', cases:['Moja Farmacja: integration of 5 companies','RM Consulting: restructuring'] },
  { id:'rozwoj',     label:'Business\nDevelopment',  cat:'skill', size:24, meta:'Not "consulting". Building. From chaos to structure, from intuition to system. With a plan and a budget.', cases:['Moja Farmacja: +33% margin','Concept: operational transformation'] },
  { id:'omnichannel', label:'Omnichannel',               cat:'skill', size:15, meta:'First successful click-and-collect implementation in a major retail chain in Poland.', cases:['DOZ.pl'] },

  { id:'cpap',     label:'CPAPblog',            cat:'misja', size:40, meta:'50k+ readers/month. Not a side-project. It\'s a responsibility.', cases:['cpapblog.pl - 50k+ readers/month','Book "Złap oddech, złap sen"'] },
  { id:'ksiazka',  label:'Book',             cat:'misja', size:22, meta:'I wrote a book about snoring. Sells better than business guides. And saves health.', cases:['"Złap oddech, złap sen" - naffy.io'] },
  { id:'sprzet',   label:'Medical\nEquipment',    cat:'misja', size:22, meta:'Misiarz: bicycles. CPAP: machines. Medicine + technology = my sweet spot.', cases:['Misiarz rehabilitation bicycles','CPAP device education'] },
  { id:'edukacja', label:'Education',            cat:'misja', size:22, meta:'I don\'t complicate simple things. I simplify complicated ones.', cases:['CPAPblog as educational platform, 50k+ readers'] },

  { id:'laczenie', label:'Connecting\nthe Dots',     cat:'meta', size:32, meta:'Not an expert in one thing. An expert in connecting. Vending ↔ pharmacy ↔ IT. Patterns repeat across industries.', cases:[] },

  {a:'systemy',b:'procesy',s:2},{a:'systemy',b:'strategia',s:2},
  {a:'pm',b:'analizabiz',s:3},{a:'pm',b:'it',s:2},
  {a:'ai',b:'it',s:2},{a:'ai',b:'pm',s:2},{a:'ai',b:'ineo',s:2},{a:'ai',b:'sdd',s:3},{a:'sdd',b:'macierz',s:3},{a:'sdd',b:'pm',s:2},{a:'sdd',b:'analizabiz',s:2},{a:'macierz',b:'farmacja',s:3},{a:'macierz',b:'ineo',s:2},{a:'transfai',b:'ai',s:3},{a:'transfai',b:'procesy',s:3},{a:'transfai',b:'systemy',s:2},{a:'transfai',b:'strategia',s:2},{a:'macierzpr',b:'sdd',s:3},{a:'macierzpr',b:'procesy',s:3},{a:'macierzpr',b:'siec',s:2},{a:'macierzpr',b:'ineo',s:1},{a:'seria',b:'transfai',s:3},{a:'seria',b:'ai',s:2},{a:'seria',b:'edukacja',s:3},{a:'seria',b:'laczenie',s:2},
  {a:'siec',b:'catman',s:2},{a:'siec',b:'marketing',s:2},
  {a:'rozwoj',b:'strategia',s:2},{a:'rozwoj',b:'systemy',s:2},
  {a:'ma',b:'strategia',s:2},{a:'procesy',b:'ai',s:1},
  // Mission
  {a:'cpap',b:'ksiazka',s:3},
  {a:'cpap',b:'edukacja',s:3},{a:'cpap',b:'sprzet',s:2},
  {a:'edukacja',b:'ksiazka',s:2},{a:'edukacja',b:'systemy',s:1},
  {a:'sprzet',b:'misiarz',s:3},
  // Meta
  {a:'laczenie',b:'farmacja',s:2},{a:'laczenie',b:'ai',s:1},
  {a:'sysmeta',b:'systemy',s:3},{a:'sysmeta',b:'procesy',s:2},
  {a:'precyzja',b:'farmacja',s:3},{a:'precyzja',b:'analizabiz',s:2},{a:'precyzja',b:'pm',s:2},
  {a:'praktyk',b:'strategia',s:2},{a:'praktyk',b:'rozwoj',s:2}
];

// ═══════════════════════════════════════
// NODE → ARTICLES mapping
// ═══════════════════════════════════════
var nodeArticles = {
  'rozwoj':    [{url:'art-dzial-rozwoju.html', title:'Development Department'}],
  'neuca':     [{url:'art-dzial-rozwoju.html', title:'Development Department'},{url:'art-sieci-male-vs-duze.html', title:'Small vs Large Networks'},{url:'art-restrukturyzacja.html', title:'Restructuring: Świat Zdrowia'}],
  'strategia': [{url:'art-z-operacji-do-strategii.html', title:'From Operations to Strategy'},{url:'art-restrukturyzacja.html', title:'Restructuring: Świat Zdrowia'}],
  'procesy':   [{url:'art-z-operacji-do-strategii.html', title:'From Operations to Strategy'},{url:'art-80-procent-wdrozen.html', title:'Why 80% of Implementations Fail'}],
  'systemy':   [{url:'art-z-operacji-do-strategii.html', title:'From Operations to Strategy'},{url:'art-80-procent-wdrozen.html', title:'Why 80% of Implementations Fail'}],
  'pm':        [{url:'art-80-procent-wdrozen.html', title:'Why 80% of Implementations Fail'}],
  'it':        [{url:'art-80-procent-wdrozen.html', title:'Why 80% of Implementations Fail'}],
  'siec':      [{url:'art-sieci-male-vs-duze.html', title:'Small vs Large Networks'},{url:'art-restrukturyzacja.html', title:'Restructuring: Świat Zdrowia'}],
  'mojafarm':  [{url:'art-sieci-male-vs-duze.html', title:'Small vs Large Networks'}],
  'catman':    [{url:'art-category-management.html', title:'Category Management'}],
  'pelion':    [{url:'art-category-management.html', title:'Category Management'}],
  'ma':        [{url:'art-restrukturyzacja.html', title:'Restructuring: Świat Zdrowia'}]
};

// ═══════════════════════════════════════
// ADJACENCY
// ═══════════════════════════════════════
var adj = {};
nodes.forEach(function(n) { adj[n.id] = new Set(); });
edges.forEach(function(e) { adj[e.a].add(e.b); adj[e.b].add(e.a); });

// ═══════════════════════════════════════
// 3D SPHERE LAYOUT (Fibonacci)
// ═══════════════════════════════════════
var SPHERE_R = 320;

function fibSphere(count, radius) {
  var pts = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < count; i++) {
    var y = 1 - (i / (count - 1)) * 2;
    var r = Math.sqrt(1 - y * y);
    var theta = golden * i;
    pts.push({ x: Math.cos(theta) * r * radius, y: y * radius, z: Math.sin(theta) * r * radius });
  }
  return pts;
}

var catOrder = ['misja','dna','skill','biznes','meta'];
var sorted = nodes.slice().sort(function(a,b) {
  var ai = catOrder.indexOf(a.cat), bi = catOrder.indexOf(b.cat);
  if (ai !== bi) return ai - bi;
  return b.size - a.size;
});
var positions = fibSphere(sorted.length, SPHERE_R);
sorted.forEach(function(n, i) {
  n.x = positions[i].x;
  n.y = positions[i].y;
  n.z = positions[i].z;
});

// ═══════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════
var rotX = -0.3, rotY = 0.4;
var autoRotY = 0;
var zoom = 1;
var isDrag = false, lastMX, lastMY, dragStartMX, dragStartMY;
var hovered = null;
var activeFilter = null;
var panelOpen = false;
var selectedNode = null;
var PERSP = 800;

function project(x, y, z) {
  var ry = rotY + autoRotY;
  var x1 = x * Math.cos(ry) - z * Math.sin(ry);
  var z1 = x * Math.sin(ry) + z * Math.cos(ry);
  var y1 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
  var z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
  var scale = PERSP / (PERSP + z2) * zoom;
  return { sx: W/2 + x1 * scale, sy: H/2 + y1 * scale, scale: scale, z: z2 };
}

// ═══════════════════════════════════════
// INPUT - mouse
// ═══════════════════════════════════════
canvas.addEventListener('mousedown', function(e) {
  isDrag = true;
  lastMX = e.clientX; lastMY = e.clientY;
  dragStartMX = e.clientX; dragStartMY = e.clientY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', function(e) {
  if (isDrag && dragStartMX !== undefined) {
    var dx = Math.abs(e.clientX - dragStartMX) + Math.abs(e.clientY - dragStartMY);
    if (dx < 5 && hovered) {
      openPanel(hovered);
    }
  }
  isDrag = false;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
});
canvas.addEventListener('mousemove', function(e) {
  if (isDrag) {
    var dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    lastMX = e.clientX; lastMY = e.clientY;
    document.getElementById('centerTitle').classList.add('hidden');
    return;
  }
  hitTest(e.clientX, e.clientY);
});
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.93 : 1.07;
  zoom = Math.max(0.4, Math.min(2.5, zoom));
  document.getElementById('centerTitle').classList.add('hidden');
}, { passive: false });

// ═══════════════════════════════════════
// INPUT - touch
// ═══════════════════════════════════════
var touchStartX, touchStartY, touchStartDist, touchStartZoom;

canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    isDrag = true;
    lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
    dragStartMX = lastMX; dragStartMY = lastMY;
  } else if (e.touches.length === 2) {
    isDrag = false;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx*dx + dy*dy);
    touchStartZoom = zoom;
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1 && isDrag) {
    var dx = e.touches[0].clientX - lastMX;
    var dy = e.touches[0].clientY - lastMY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
    document.getElementById('centerTitle').classList.add('hidden');
  } else if (e.touches.length === 2) {
    var ddx = e.touches[0].clientX - e.touches[1].clientX;
    var ddy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(ddx*ddx + ddy*ddy);
    zoom = touchStartZoom * (dist / touchStartDist);
    zoom = Math.max(0.4, Math.min(2.5, zoom));
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  if (e.changedTouches.length === 1 && dragStartMX !== undefined) {
    var ct = e.changedTouches[0];
    var dx = Math.abs(ct.clientX - dragStartMX) + Math.abs(ct.clientY - dragStartMY);
    if (dx < 10) {
      hitTest(ct.clientX, ct.clientY);
      if (hovered) openPanel(hovered);
    }
  }
  isDrag = false;
});

function hitTest(mx, my) {
  hovered = null;
  var closestDist = Infinity;
  nodes.forEach(function(n) {
    if (activeFilter && n.cat !== activeFilter) return;
    var p = project(n.x, n.y, n.z);
    var r = Math.max(n.size * p.scale * 0.06, 8);
    var dx = mx - p.sx, dy = my - p.sy;
    var dist = dx*dx + dy*dy;
    if (dist < (r + 15) * (r + 15) && dist < closestDist) {
      closestDist = dist;
      hovered = n;
    }
  });
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
}

// ═══════════════════════════════════════
// FILTER
// ═══════════════════════════════════════
function setFilter(cat) {
  activeFilter = cat;
  // Desktop filters
  document.querySelectorAll('.topbar-filters button').forEach(function(b) { b.classList.remove('active'); });
  var desktopBtn = document.getElementById(cat ? 'f-'+cat : 'f-all');
  if (desktopBtn) desktopBtn.classList.add('active');
  // Mobile filters
  document.querySelectorAll('.mobile-filters button').forEach(function(b) { b.classList.remove('active'); });
  var mobileBtn = document.querySelector('.mobile-filters button[data-f="'+(cat||'all')+'"]');
  if (mobileBtn) mobileBtn.classList.add('active');
}

// ═══════════════════════════════════════
// PANEL
// ═══════════════════════════════════════
function openPanel(node) {
  selectedNode = node;
  var cat = CATS[node.cat];
  document.getElementById('pCat').textContent = cat.label;
  document.getElementById('pCat').style.color = cat.hex;
  document.getElementById('pTitle').textContent = node.label.replace('\n',' ');
  document.getElementById('pMeta').textContent = node.meta;

  var casesEl = document.getElementById('pCases');
  casesEl.innerHTML = '';
  if (node.cases && node.cases.length) {
    node.cases.forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'panel-case';
      d.innerHTML = '→ ' + c;
      casesEl.appendChild(d);
    });
    document.getElementById('pCasesSection').style.display = '';
  } else {
    document.getElementById('pCasesSection').style.display = 'none';
  }

  // Articles
  var articlesEl = document.getElementById('pArticles');
  articlesEl.innerHTML = '';
  var arts = nodeArticles[node.id];
  if (arts && arts.length) {
    arts.forEach(function(a) {
      var link = document.createElement('a');
      link.className = 'panel-article-link';
      link.href = a.url;
      link.textContent = a.title;
      articlesEl.appendChild(link);
    });
    document.getElementById('pArticlesSection').style.display = '';
  } else {
    document.getElementById('pArticlesSection').style.display = 'none';
  }

  var connsEl = document.getElementById('pConns');
  connsEl.innerHTML = '';
  var connected = Array.from(adj[node.id]);
  connected.forEach(function(id) {
    var n = nodes.find(function(nn) { return nn.id === id; });
    if (!n) return;
    var tag = document.createElement('div');
    tag.className = 'panel-conn-tag';
    tag.textContent = n.label.replace('\n',' ');
    tag.onclick = function() { openPanel(n); };
    connsEl.appendChild(tag);
  });

  document.getElementById('panel').classList.add('open');
  panelOpen = true;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  panelOpen = false;
  selectedNode = null;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
var t = 0;

function render() {
  t += 0.005;
  if (!isDrag) autoRotY += 0.0008;

  ctx.clearRect(0, 0, W, H);

  // BG - subtle radial from VV ink
  var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.6);
  bg.addColorStop(0, '#242426');
  bg.addColorStop(1, '#1d1d1f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Project all nodes
  var projected = nodes.map(function(n) {
    var p = project(n.x, n.y, n.z);
    return { id:n.id, label:n.label, cat:n.cat, size:n.size, meta:n.meta, cases:n.cases,
             x:n.x, y:n.y, z:n.z, sx:p.sx, sy:p.sy, scale:p.scale, zp:p.z };
  });

  // Sort by z (painter's algorithm)
  projected.sort(function(a, b) { return b.zp - a.zp; });

  function isActive(n) {
    if (!activeFilter) return true;
    return n.cat === activeFilter;
  }
  function isConnected(n) {
    if (!hovered && !selectedNode) return false;
    var ref = hovered || selectedNode;
    return n.id === ref.id || adj[ref.id].has(n.id);
  }
  var hasHighlight = hovered || selectedNode;

  // ── Draw edges ──
  edges.forEach(function(e) {
    var na = nodes.find(function(n) { return n.id === e.a; });
    var nb = nodes.find(function(n) { return n.id === e.b; });
    if (!na || !nb) return;

    var pa = project(na.x, na.y, na.z);
    var pb = project(nb.x, nb.y, nb.z);
    var aAct = isActive(na), bAct = isActive(nb);
    if (!aAct && !bAct) return;

    var ref = hovered || selectedNode;
    var edgeHL = ref && (e.a === ref.id || e.b === ref.id);

    if (hasHighlight && !edgeHL) {
      ctx.globalAlpha = 0.03;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.5;
    } else if (edgeHL) {
      var col = CATS[na.cat].hex;
      ctx.globalAlpha = 0.4 + Math.sin(t * 4) * 0.1;
      ctx.strokeStyle = col;
      ctx.lineWidth = e.s * 1;
    } else {
      var avgZ = (pa.z + pb.z) / 2;
      var depth = 1 - (avgZ + SPHERE_R) / (SPHERE_R * 2);
      ctx.globalAlpha = 0.04 + depth * 0.08;
      ctx.strokeStyle = '#888';
      ctx.lineWidth = e.s * 0.5;
    }

    ctx.beginPath();
    ctx.moveTo(pa.sx, pa.sy);
    ctx.lineTo(pb.sx, pb.sy);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // ── Draw nodes ──
  projected.forEach(function(n) {
    var active = isActive(n);
    var connected = isConnected(n);
    var isHov = hovered && n.id === hovered.id;
    var isSel = selectedNode && n.id === selectedNode.id;
    var col = CATS[n.cat].color;
    var hex = CATS[n.cat].hex;

    var depth = 1 - (n.zp + SPHERE_R) / (SPHERE_R * 2);
    var r = n.size * n.scale * 0.065 * (isHov ? 1.15 : 1);

    var alpha = 1;
    if (!active) alpha = 0.05;
    else if (hasHighlight && !connected && !isHov) alpha = 0.1;
    else alpha = 0.25 + depth * 0.75;

    // Glow
    if (alpha > 0.2) {
      var glow = ctx.createRadialGradient(n.sx, n.sy, r*0.3, n.sx, n.sy, r*2.5);
      glow.addColorStop(0, 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.25 : 0.08))+')');
      glow.addColorStop(1, 'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Circle fill
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.4 : 0.15))+')';
    ctx.fill();

    // Circle stroke
    ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.9 : 0.5))+')';
    ctx.lineWidth = (isHov || isSel ? 1.5 : 1) * Math.max(n.scale * 0.8, 0.5);
    ctx.stroke();

    // Center dot
    if (alpha > 0.15) {
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, Math.max(1.5, r * 0.18), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * 0.85)+')';
      ctx.fill();
    }

    // Label
    if (alpha > 0.15 && n.scale * zoom > 0.25) {
      var lines = n.label.split('\n');
      var fontSize = Math.max(11, Math.min(15, n.size * n.scale * 0.045 * (isHov ? 1.1 : 1)));
      ctx.font = (isHov ? '600 ' : '400 ') + fontSize + 'px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,'+(alpha * (isHov ? 0.95 : 0.65))+')';

      lines.forEach(function(line, i) {
        var yoff = r + (12 + i * (fontSize + 2));
        ctx.fillText(line, n.sx, n.sy + yoff);
      });
    }
  });

  requestAnimationFrame(render);
}

render();
</script>
