<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Strona nie znaleziona | Rafał Myrta</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3ERM%3C/text%3E%3C/svg%3E">
  <style>
    :root { --ink: #1d1d1f; --gray: #6e6e73; --gray-light: #d2d2d7; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .code { font-size: 96px; font-weight: 700; letter-spacing: -4px; line-height: 1; }
    .message { font-size: 18px; color: var(--gray); margin: 16px 0 32px; line-height: 1.5; }
    .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      transition: background 0.2s;
    }
    .links a:hover { background: #f5f5f7; }
  
    a:focus-visible, button:focus-visible { outline: 2px solid #1d1d1f; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">Tej strony nie ma. Może przeniosła się w lepsze miejsce.</p>
    <div class="links">
      <a href="index.html">Strona główna</a>
      <a href="ksiazka.html">Książka</a>
    </div>
    <p style="margin-top:48px; font-size:11px; color:#d2d2d7;">Hmm, chyba że szukasz <a href="wizytowka.html" style="color:#d2d2d7; text-decoration:underline; text-decoration-style:dotted;">starej wersji tej strony</a>...</p>
  </div>
</body>
</html>
