  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
     --ink: #1d1d1f;
     --gray: #86868b;
     --gray-light: #d2d2d7;
     --card-bg: #fbfbfd;
     --white: #ffffff;
     --sans: -apple-system, "system-ui", "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--white);
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    canvas { display: block; }

    /* ── Nav (identical to main site) ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      height: 49px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--gray-light);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .topbar-logo {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.3px;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .topbar-logo:hover { opacity: 0.7; }

    .topbar-back {
      font-size: 12px;
      font-weight: 400;
      color: var(--gray);
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .topbar-back:hover { opacity: 0.7; }

    .topbar-filters {
      display: flex;
      gap: 4px;
    }
    .topbar-filters button {
      background: none;
      border: 1px solid var(--gray-light);
      color: var(--gray);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 980px;
      letter-spacing: 0.01em;
    }
    .topbar-filters button:hover {
      color: var(--ink);
      border-color: var(--gray);
    }
    .topbar-filters button.active {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    /* ── Panel ── */
    .panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 380px;
      z-index: 150;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--gray-light);
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      padding: 72px 28px 28px;
    }
    .panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--gray);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      transition: color 0.2s;
    }
    .panel-close:hover { color: var(--ink); }

    .panel-cat {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .panel-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 20px;
      color: var(--ink);
    }
    .panel-section { margin-bottom: 24px; }
    .panel-section-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--gray-light);
    }
    .panel-desc {
      font-size: 15px;
      line-height: 1.5;
      color: #515154;
      font-style: italic;
    }
    .panel-case {
      font-size: 13px;
      line-height: 1.6;
      color: var(--gray);
      margin-bottom: 4px;
    }
    .panel-case strong { color: var(--ink); font-weight: 600; }
    .panel-connections {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .panel-conn-tag {
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid var(--gray-light);
      border-radius: 980px;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
    }
    .panel-conn-tag:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .panel-article-link {
      display: block;
      font-size: 13px;
      color: var(--gray);
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 1px solid var(--gray-light);
      transition: color 0.2s;
    }
    .panel-article-link:hover { color: var(--ink); }
    .panel-article-link::before { content: '→ '; opacity: 0.5; }

    /* ── Legend ── */
    .legend {
      position: fixed;
      bottom: 20px;
      left: 24px;
      z-index: 100;
      display: flex;
      gap: 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--gray);
      letter-spacing: 0.03em;
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ── Hint ── */
    .hint {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 100;
      font-size: 10px;
      color: var(--gray-light);
      text-align: right;
      line-height: 1.8;
    }

    /* ── Center title ── */
    .center-title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      text-align: center;
      pointer-events: none;
      transition: opacity 1.5s;
    }
    .center-title.hidden { opacity: 0; }
    .center-title h1 {
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: rgba(29,29,31,0.08);
      line-height: 1.3;
    }
    .center-title p {
      font-size: 13px;
      font-weight: 400;
      color: rgba(29,29,31,0.15);
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .topbar-filters { display: none; }
      .mobile-filters {
        display: flex !important;
        position: fixed;
        bottom: 16px;
        left: 12px;
        right: 12px;
        z-index: 100;
        gap: 4px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .mobile-filters button {
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--gray-light);
        color: var(--gray);
        font-family: var(--sans);
        font-size: 10px;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 980px;
      }
      .mobile-filters button.active {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      .panel {
        width: 100%;
        padding: 64px 20px 20px;
      }
      .legend { display: none; }
      .hint { display: none; }
    }

    .mobile-filters { display: none; }
  </style>
</head>

var nodes = [
  // DNA
  { id:'farmacja',  label:'Farmacja',    cat:'dna', size:36, meta:'5 lat studiów nauczyło mnie precyzji, protokołów i pokory wobec złożoności. Te same rzeczy przydają się w biznesie.', cases:['Śl. Akademia Medyczna 1994-99','Apteka Pod Arkadami od 2000','Pelion, NEUCA, Super-Pharm'] },
  { id:'slask',     label:'Śląsk',       cat:'dna', size:14, meta:'Katowice, Będzin, Tychy. Nie mówię "wyzwanie". Mówię "problem do rozwiązania".', cases:[] },
  { id:'ciekawosc', label:'Ciekawość',   cat:'dna', size:20, meta:'Każda branża wygląda inaczej z zewnątrz. Od środka? Wszędzie podobne problemy. Wyłapuje schematy.', cases:[] },

  // Biznesy - aktualne
  { id:'ineo',    label:'INEOGroup\n×Super-Pharm', cat:'biznes', size:30, meta:'PM + ekspert farmaceutyczny. Jedyna alternatywa dla monopolisty Kamsoft na rynku IT dla aptek.', cases:['Migracja systemu aptecznego na iXPOS','Specyfikacje, koordynacja zespołów dev'] },
  { id:'concept', label:'Concept\nAutomatic',      cat:'biznes', size:26, meta:'Vending. Poszukiwanie innowacji w handlu z wykorzystaniem automatyzacji i robotyki.', cases:['Projekt Sipply'] },
  { id:'misiarz', label:'Misiarz',                 cat:'biznes', size:26, meta:'Rowery dla dzieci które nie mogą chodzić. Firma teścia z 1987. CE, ISO, eksport. To nie biznes - to zobowiązanie.', cases:['Rowery rehabilitacyjne na zamówienie','Certyfikacja CE, ISO 9001','Eksport do Szwecji, refundacja NFZ/PFRON'] },
  { id:'apteka',  label:'Apteka\nPod Arkadami',    cat:'biznes', size:18, meta:'Będzin, od 2000. 25 lat stabilności w portfolio chaosu.', cases:['Własna apteka od 2000 roku'] },

  // Biznesy - historia
  { id:'neuca',    label:'NEUCA',                   cat:'biznes', size:24, meta:'3800 aptek. 60 handlowców. 200 telesales. Jak się zarządza czymś takim? Systemami.', cases:['Dyrektor Rozwoju i Strategii 2007-13','Sieć "Świat Zdrowia" ~1200 aptek','PMO, MBO, strategia dla zarządu'] },
  { id:'pelion',   label:'Pelion\nDOZ',             cat:'biznes', size:20, meta:'Pierwsza apteka internetowa w PL. 2003. IE6. Flash. Ale działało.', cases:['doz.pl/apteka - 1. apteka internetowa w PL','Sprzęt rehabilitacyjny w aptekach → +25%'] },
  { id:'mojafarm', label:'Moja\nFarmacja',          cat:'biznes', size:17, meta:'CEO. Portugalski VC. 5 spółek. +33% marży w 12 miesięcy. Potem VC zmienił zdanie. Classic.', cases:['+12,7% sprzedaży w 12 mies.','+33,3% marży brutto','Lean Startup, budżet online'] },
  { id:'rmcons',   label:'RM Consulting\nDeloitte', cat:'biznes', size:17, meta:'Audyty, restrukturyzacje, M&A. Dla Deloitte. Mówię to szeptem.', cases:['Audyty organizacyjne','Restrukturyzacje i M&A','Optymalizacja modeli biznesowych'] },

  { id:'analizabiz', label:'Analiza\nbiznesowa',      cat:'skill', size:32, meta:'Tłumaczę między biznesem a kodem. Oba uważają że ten drugi jest niekompetentny. Moja robota to most.', cases:['INEOGroup: specyfikacje iXPOS','NEUCA: analiza portfolio aptek'] },
  { id:'pm',         label:'Zarządzanie\nprojektami',  cat:'skill', size:32, meta:'Plan jest ważny. Ale najważniejsze narzędzie to telefon i umiejętność powiedzenia "nie".', cases:['INEOGroup: PM migracji systemu','NEUCA: PMO, portfel projektów','Pelion: koordynacja e-commerce'] },
  { id:'systemy',    label:'Systemy\nzarządzania',     cat:'skill', size:34, meta:'OKR, BSC, MBO. 90% ludzi myli OKR z listą zadań. System to nie narzędzie - to sposób myślenia.', cases:['NEUCA: OKR/MBO dla 3800 aptek','Concept: procesy operacyjne','Moja Farmacja: budżet od zera'] },
  { id:'strategia',  label:'Consulting\nstrategiczny',  cat:'skill', size:26, meta:'Strategia to nie slajdy które zbierają kurz. To decyzje + plan + egzekucja. W tej kolejności.', cases:['RM Consulting / Deloitte','Moja Farmacja: strategia dla VC'] },

  { id:'siec',       label:'Zarządzanie\nsiecią',       cat:'skill', size:28, meta:'Od 120 aptek do 3800. Potem znowu do kilku. Wiem jak wygląda obie strony. Skala zmienia WSZYSTKO.', cases:['NEUCA: 3800 aptek "Świat Zdrowia"','Pelion: sieć franczyzowa'] },

  { id:'cpap',     label:'CPAPblog',            cat:'misja', size:40, meta:'50k+ czytelników/mies. To nie side-project. To odpowiedzialność.', cases:['cpapblog.pl - 50k+ czytelników/mies.','Książka "Złap oddech, złap sen"'] },

// ═══════════════════════════════════════
// EDGES

var edges = [

  {a:'farmacja',b:'apteka',s:3},{a:'farmacja',b:'ineo',s:2},{a:'farmacja',b:'cpap',s:3},
  {a:'farmacja',b:'misiarz',s:2},{a:'farmacja',b:'pelion',s:2},{a:'farmacja',b:'neuca',s:2},

  {a:'ineo',b:'pm',s:3},{a:'ineo',b:'analizabiz',s:3},{a:'ineo',b:'it',s:3},
  {a:'concept',b:'ai',s:2},{a:'concept',b:'procesy',s:2},
  {a:'neuca',b:'siec',s:3},{a:'neuca',b:'systemy',s:3},{a:'neuca',b:'marketing',s:3},
  {a:'neuca',b:'strategia',s:2},{a:'pelion',b:'catman',s:3},{a:'pelion',b:'omnichannel',s:3},

  {a:'cpap',b:'ksiazka',s:3},

// ═══════════════════════════════════════
// NODE → ARTICLES mapping
// ═══════════════════════════════════════
var nodeArticles = {
  'rozwoj':    [{url:'art-dzial-rozwoju.html', title:'Dział Rozwoju'}],
  'neuca':     [{url:'art-dzial-rozwoju.html', title:'Dział Rozwoju'},{url:'art-sieci-male-vs-duze.html', title:'Sieci małe vs duże'},{url:'art-restrukturyzacja.html', title:'Restrukturyzacja: Świat Zdrowia'}],

  'procesy':   [{url:'art-z-operacji-do-strategii.html', title:'Z operacji do strategii'},{url:'art-80-procent-wdrozen.html', title:'Dlaczego 80% wdrożeń się nie udaje'}],
  'systemy':   [{url:'art-z-operacji-do-strategii.html', title:'Z operacji do strategii'},{url:'art-80-procent-wdrozen.html', title:'Dlaczego 80% wdrożeń się nie udaje'}],
  'pm':        [{url:'art-80-procent-wdrozen.html', title:'Dlaczego 80% wdrożeń się nie udaje'}],

  'siec':      [{url:'art-sieci-male-vs-duze.html', title:'Sieci małe vs duże'},{url:'art-restrukturyzacja.html', title:'Restrukturyzacja: Świat Zdrowia'}],
  'mojafarm':  [{url:'art-sieci-male-vs-duze.html', title:'Sieci małe vs duże'}],
  'catman':    [{url:'art-category-management.html', title:'Category Management'}],

  'ma':        [{url:'art-restrukturyzacja.html', title:'Restrukturyzacja: Świat Zdrowia'}]
};

// ═══════════════════════════════════════
// ADJACENCY
// ═══════════════════════════════════════
var adj = {};
nodes.forEach(function(n) { adj[n.id] = new Set(); });
edges.forEach(function(e) { adj[e.a].add(e.b); adj[e.b].add(e.a); });

// ═══════════════════════════════════════
// 3D SPHERE LAYOUT
// ═══════════════════════════════════════
var SPHERE_R = 320;

function fibSphere(count, radius) {
  var pts = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < count; i++) {
    var y = 1 - (i / (count - 1)) * 2;
    var r = Math.sqrt(1 - y * y);
    var theta = golden * i;
    pts.push({ x: Math.cos(theta) * r * radius, y: y * radius, z: Math.sin(theta) * r * radius });
  }
  return pts;
}

var catOrder = ['misja','dna','skill','biznes','meta'];
var sorted = nodes.slice().sort(function(a,b) {
  var ai = catOrder.indexOf(a.cat), bi = catOrder.indexOf(b.cat);
  if (ai !== bi) return ai - bi;
  return b.size - a.size;
});
var positions = fibSphere(sorted.length, SPHERE_R);
sorted.forEach(function(n, i) { n.x = positions[i].x; n.y = positions[i].y; n.z = positions[i].z; });

// ═══════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════
var rotX = -0.3, rotY = 0.4;
var autoRotY = 0;
var COMPACT = Math.min(W, H) < 700;
var zoom = COMPACT ? Math.max(0.45, Math.min(1, Math.min(W, H) / 760)) : 1;
var isDrag = false, lastMX, lastMY, dragStartMX, dragStartMY;
var hovered = null;
var activeFilter = null;
var panelOpen = false;
var selectedNode = null;
var PERSP = 800;

function project(x, y, z) {
  var ry = rotY + autoRotY;
  var x1 = x * Math.cos(ry) - z * Math.sin(ry);
  var z1 = x * Math.sin(ry) + z * Math.cos(ry);
  var y1 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
  var z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
  var scale = PERSP / (PERSP + z2) * zoom;
  return { sx: W/2 + x1 * scale, sy: H/2 + y1 * scale, scale: scale, z: z2 };
}

// ═══════════════════════════════════════
// INPUT - mouse
// ═══════════════════════════════════════
canvas.addEventListener('mousedown', function(e) {
  isDrag = true;
  lastMX = e.clientX; lastMY = e.clientY;
  dragStartMX = e.clientX; dragStartMY = e.clientY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', function(e) {
  if (isDrag && dragStartMX !== undefined) {
    var dx = Math.abs(e.clientX - dragStartMX) + Math.abs(e.clientY - dragStartMY);
    if (dx < 5 && hovered) openPanel(hovered);
  }
  isDrag = false;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
});
canvas.addEventListener('mousemove', function(e) {
  if (isDrag) {
    var dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    lastMX = e.clientX; lastMY = e.clientY;
    document.getElementById('centerTitle').classList.add('hidden');
    return;
  }
  hitTest(e.clientX, e.clientY);
});
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.93 : 1.07;
  zoom = Math.max(0.4, Math.min(2.5, zoom));
  document.getElementById('centerTitle').classList.add('hidden');
}, { passive: false });

// ═══════════════════════════════════════
// INPUT - touch
// ═══════════════════════════════════════
var touchStartDist, touchStartZoom;

canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    isDrag = true;
    lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
    dragStartMX = lastMX; dragStartMY = lastMY;
  } else if (e.touches.length === 2) {
    isDrag = false;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx*dx + dy*dy);
    touchStartZoom = zoom;
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1 && isDrag) {
    var dx = e.touches[0].clientX - lastMX;
    var dy = e.touches[0].clientY - lastMY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
    document.getElementById('centerTitle').classList.add('hidden');
  } else if (e.touches.length === 2) {
    var ddx = e.touches[0].clientX - e.touches[1].clientX;
    var ddy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(ddx*ddx + ddy*ddy);
    zoom = touchStartZoom * (dist / touchStartDist);
    zoom = Math.max(0.4, Math.min(2.5, zoom));
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  if (e.changedTouches.length === 1 && dragStartMX !== undefined) {
    var ct = e.changedTouches[0];
    var dx = Math.abs(ct.clientX - dragStartMX) + Math.abs(ct.clientY - dragStartMY);
    if (dx < 10) {
      hitTest(ct.clientX, ct.clientY);
      if (hovered) openPanel(hovered);
    }
  }
  isDrag = false;
});

function hitTest(mx, my) {
  hovered = null;
  var closestDist = Infinity;
  nodes.forEach(function(n) {
    if (activeFilter && n.cat !== activeFilter) return;
    var p = project(n.x, n.y, n.z);
    var r = Math.max(n.size * p.scale * 0.06, 8);
    var dx = mx - p.sx, dy = my - p.sy;
    var dist = dx*dx + dy*dy;
    if (dist < (r + 15) * (r + 15) && dist < closestDist) {
      closestDist = dist; hovered = n;
    }
  });
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
}

// ═══════════════════════════════════════
// FILTER
// ═══════════════════════════════════════
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.topbar-filters button').forEach(function(b) { b.classList.remove('active'); });
  var desktopBtn = document.getElementById(cat ? 'f-'+cat : 'f-all');
  if (desktopBtn) desktopBtn.classList.add('active');
  document.querySelectorAll('.mobile-filters button').forEach(function(b) { b.classList.remove('active'); });
  var mobileBtn = document.querySelector('.mobile-filters button[data-f="'+(cat||'all')+'"]');
  if (mobileBtn) mobileBtn.classList.add('active');
}

// ═══════════════════════════════════════
// PANEL
// ═══════════════════════════════════════
function openPanel(node) {
  selectedNode = node;
  var cat = CATS[node.cat];
  document.getElementById('pCat').textContent = cat.label;
  document.getElementById('pCat').style.color = cat.hex;
  document.getElementById('pTitle').textContent = node.label.replace('\n',' ');
  document.getElementById('pMeta').textContent = node.meta;

  var casesEl = document.getElementById('pCases');
  casesEl.innerHTML = '';
  if (node.cases && node.cases.length) {
    node.cases.forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'panel-case';
      d.innerHTML = '→ ' + c;
      casesEl.appendChild(d);
    });
    document.getElementById('pCasesSection').style.display = '';
  } else {
    document.getElementById('pCasesSection').style.display = 'none';
  }

  // Articles
  var articlesEl = document.getElementById('pArticles');
  articlesEl.innerHTML = '';
  var arts = nodeArticles[node.id];
  if (arts && arts.length) {
    arts.forEach(function(a) {
      var link = document.createElement('a');
      link.className = 'panel-article-link';
      link.href = a.url;
      link.textContent = a.title;
      articlesEl.appendChild(link);
    });
    document.getElementById('pArticlesSection').style.display = '';
  } else {
    document.getElementById('pArticlesSection').style.display = 'none';
  }

  var connsEl = document.getElementById('pConns');
  connsEl.innerHTML = '';
  Array.from(adj[node.id]).forEach(function(id) {
    var n = nodes.find(function(nn) { return nn.id === id; });
    if (!n) return;
    var tag = document.createElement('div');
    tag.className = 'panel-conn-tag';
    tag.textContent = n.label.replace('\n',' ');
    tag.onclick = function() { openPanel(n); };
    connsEl.appendChild(tag);
  });

  document.getElementById('panel').classList.add('open');
  panelOpen = true;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  panelOpen = false;
  selectedNode = null;
}

// ═══════════════════════════════════════
// RENDER - white theme
// ═══════════════════════════════════════
var t = 0;

function render() {
  t += 0.005;
  if (!isDrag) autoRotY += 0.0008;

  ctx.clearRect(0, 0, W, H);

  // BG - white with subtle warm radial
  var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.6);
  bg.addColorStop(0, '#fafafa');
  bg.addColorStop(1, '#f5f5f7');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Project all nodes
  var projected = nodes.map(function(n) {
    var p = project(n.x, n.y, n.z);
    return { id:n.id, label:n.label, cat:n.cat, size:n.size, meta:n.meta, cases:n.cases,
             x:n.x, y:n.y, z:n.z, sx:p.sx, sy:p.sy, scale:p.scale, zp:p.z };
  });

  projected.sort(function(a, b) { return b.zp - a.zp; });

  function isActive(n) { return !activeFilter || n.cat === activeFilter; }
  function isConnected(n) {
    if (!hovered && !selectedNode) return false;
    var ref = hovered || selectedNode;
    return n.id === ref.id || adj[ref.id].has(n.id);
  }
  var hasHighlight = hovered || selectedNode;

  // ── Draw edges ──
  edges.forEach(function(e) {
    var na = nodes.find(function(n) { return n.id === e.a; });
    var nb = nodes.find(function(n) { return n.id === e.b; });
    if (!na || !nb) return;

    var pa = project(na.x, na.y, na.z);
    var pb = project(nb.x, nb.y, nb.z);
    if (!isActive(na) && !isActive(nb)) return;

    var ref = hovered || selectedNode;
    var edgeHL = ref && (e.a === ref.id || e.b === ref.id);

    if (hasHighlight && !edgeHL) {
      ctx.globalAlpha = 0.04;
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 0.5;
    } else if (edgeHL) {
      ctx.globalAlpha = 0.5 + Math.sin(t * 4) * 0.1;
      ctx.strokeStyle = CATS[na.cat].hex;
      ctx.lineWidth = e.s * 1.2;
    } else {
      var avgZ = (pa.z + pb.z) / 2;
      var depth = 1 - (avgZ + SPHERE_R) / (SPHERE_R * 2);
      ctx.globalAlpha = 0.06 + depth * 0.1;
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = e.s * 0.5;
    }

    ctx.beginPath();
    ctx.moveTo(pa.sx, pa.sy);
    ctx.lineTo(pb.sx, pb.sy);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // ── Draw nodes ──
  projected.forEach(function(n) {
    var active = isActive(n);
    var connected = isConnected(n);
    var isHov = hovered && n.id === hovered.id;
    var isSel = selectedNode && n.id === selectedNode.id;
    var col = CATS[n.cat].color;

    var depth = 1 - (n.zp + SPHERE_R) / (SPHERE_R * 2);
    var r = n.size * n.scale * 0.065 * (isHov ? 1.15 : 1);

    var alpha = 1;
    if (!active) alpha = 0.06;
    else if (hasHighlight && !connected && !isHov) alpha = 0.12;
    else alpha = 0.3 + depth * 0.7;

    // Glow (softer on white)
    if (alpha > 0.2) {
      var glow = ctx.createRadialGradient(n.sx, n.sy, r*0.3, n.sx, n.sy, r*2.5);
      glow.addColorStop(0, 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.15 : 0.06))+')');
      glow.addColorStop(1, 'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Circle fill (slightly more opaque on white)
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.35 : 0.12))+')';
    ctx.fill();

    // Circle stroke
    ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * (isHov ? 0.85 : 0.45))+')';
    ctx.lineWidth = (isHov || isSel ? 1.5 : 1) * Math.max(n.scale * 0.8, 0.5);
    ctx.stroke();

    // Center dot
    if (alpha > 0.15) {
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, Math.max(1.5, r * 0.18), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha * 0.8)+')';
      ctx.fill();
    }

    // Label - dark text on white
    if (alpha > 0.15 && n.scale * zoom > 0.25 && (!COMPACT || n.size >= 24 || isHov || isSel)) {
      var lines = n.label.split('\n');
      var fontSize = Math.max(11, Math.min(15, n.size * n.scale * 0.045 * (isHov ? 1.1 : 1)));
      ctx.font = (isHov ? '600 ' : '400 ') + fontSize + 'px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(29,29,31,'+(alpha * (isHov ? 0.9 : 0.55))+')';

      lines.forEach(function(line, i) {
        var yoff = r + (12 + i * (fontSize + 2));
        ctx.fillText(line, n.sx, n.sy + yoff);
      });
    }
  });

  requestAnimationFrame(render);
}

render();
</script>
